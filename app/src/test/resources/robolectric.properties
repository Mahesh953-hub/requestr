# Robolectric sandbox SDK for JVM unit tests.
#
# compileSdk/targetSdk is 36, but Robolectric 4.16's SDK 36 sandbox requires
# Java 21 while this project's mandated build toolchain is JDK 17. The cached
# offline Robolectric android-all-instrumented jar (and every test that already
# pins @Config(sdk = [Build.VERSION_CODES.Q])) uses API 29 / Android 10, which
# runs under Java 17. Pin the default here so tests without an explicit
# @Config sdk annotation no longer fall back to targetSdk 36 and fail with
# "Android SDK 36 requires Java 21". This is a test-only resource; it changes
# no production or QUIC code and does not affect the on-device runtime.
sdk=29
