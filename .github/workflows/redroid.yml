name: Redroid verification

on:
  workflow_dispatch:
  push:
    branches:
      - "vorflux/interceptor-s5-**"

concurrency:
  group: redroid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected-android-tests:
    name: Redroid connected Android tests
    runs-on: [self-hosted, Linux, ARM64, android, redroid]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment
        run: cp .env.example .env

      - name: Verify Redroid is reachable
        run: |
          adb start-server
          adb connect 127.0.0.1:5555 || true
          adb wait-for-device
          adb -s 127.0.0.1:5555 get-state | grep -Fx device
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abi

      - name: Build debug APK and Android test APK
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
            -x cargoBuildTun2ProxyBridge \
            --no-daemon --stacktrace

      - name: Run connected Android tests
        run: |
          ANDROID_SERIAL=127.0.0.1:5555 ./gradlew :app:connectedDebugAndroidTest \
            -x cargoBuildTun2ProxyBridge \
            --no-daemon --stacktrace

      - name: Upload Android test results and device logs
        if: always()
        run: |
          mkdir -p build-artifacts
          adb -s 127.0.0.1:5555 logcat -d -t 2000 > build-artifacts/redroid-logcat.txt || true
          adb -s 127.0.0.1:5555 shell getprop > build-artifacts/redroid-properties.txt || true

      - name: Publish Android test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redroid-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build-artifacts/
          retention-days: 14
