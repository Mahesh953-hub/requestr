<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>requestr — Dynamic Header Pill & Floating Navbar Component Showcase (Editorial Light)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FDFBF7;
      --bg-gradient: radial-gradient(circle at 50% 0%, #FAF5FF 0%, #FDFBF7 65%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(15, 23, 42, 0.08);
      --text: #1E293B;
      --text-muted: #64748B;
      --emerald: #059669;
      --cyan: #0891B2;
      --purple: #7C3AED;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-gradient);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h1 { font-size: 18px; font-weight: 800; color: #1E293B; }
    h2 { font-size: 13px; font-weight: 700; font-family: var(--font-mono); color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }

    /* Header Pill Variants */
    .header-capsule {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
    }
    .circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: #FFFFFF;
      border: 1px solid rgba(15, 23, 42, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }
    .identity-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 14px;
      color: #FFF;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Floating Nav Pill */
    .floating-nav-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 28px;
      align-self: center;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.08);
    }
    .nav-pill-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-pill-btn.active {
      background: rgba(5, 150, 105, 0.12);
      color: #059669;
      border: 1px solid rgba(5, 150, 105, 0.35);
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <h1>Dynamic Header & Floating Nav Pill System</h1>
      <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">Editorial Light Design Tokens & Component Specifications</p>
    </div>

    <div>
      <h2>1. Home Screen Header Capsule</h2>
      <div class="header-capsule">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="circle-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          </div>
          <div class="identity-pill" style="background: rgba(5, 150, 105, 0.12); border: 1px solid rgba(5, 150, 105, 0.35); color: #047857;">
            <div class="pulse-dot" style="background: #059669; box-shadow: 0 0 8px #059669;"></div>
            <span>requestr</span>
          </div>
        </div>
        <div class="circle-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
      </div>
    </div>

    <div>
      <h2>2. Interceptr VPN Active Capsule</h2>
      <div class="header-capsule">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="circle-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
          <div class="identity-pill" style="background: rgba(8, 145, 178, 0.1); border: 1px solid rgba(8, 145, 178, 0.35); color: #0E7490;">
            <div class="pulse-dot" style="background: #0891B2; box-shadow: 0 0 8px #0891B2;"></div>
            <span>interceptr :8080</span>
          </div>
        </div>
        <div class="circle-btn" style="border-color: rgba(225, 29, 72, 0.35);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E11D48" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        </div>
      </div>
    </div>

    <div>
      <h2>3. Reqy AI Dynamic Capsule</h2>
      <div class="header-capsule">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="circle-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          </div>
          <div class="identity-pill" style="background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.35); color: #6D28D9;">
            <div class="pulse-dot" style="background: #7C3AED; box-shadow: 0 0 8px #7C3AED;"></div>
            <span>reqy ai</span>
          </div>
        </div>
        <div class="circle-btn" style="border-color: rgba(124, 58, 237, 0.4);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
    </div>

    <div>
      <h2>4. Floating Nav Pill (Bottom Navigation)</h2>
      <div class="floating-nav-pill">
        <div class="nav-pill-btn active" title="Home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </div>
        <div class="nav-pill-btn" title="Intercept">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <div class="nav-pill-btn" title="API Testr">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
        </div>
        <div class="nav-pill-btn" title="Tools">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 9 6 6m0-6-6 6"/></svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
