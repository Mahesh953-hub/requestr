<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>requestr — Saved APIs & Collections (Obsidian Dark)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090D16;
      --bg-gradient: radial-gradient(circle at 50% 0%, #151F32 0%, #090D16 65%);
      --card-bg: rgba(22, 27, 44, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --emerald: #10B981;
      --emerald-glow: rgba(16, 185, 129, 0.2);
      --cyan: #06B6D4;
      --amber: #F59E0B;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-gradient);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 16px 16px 100px;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .app-screen { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
    
    /* Header Capsule */
    .header-capsule {
      position: sticky;
      top: 12px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .circle-btn {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s ease;
    }
    .circle-btn:hover { background: rgba(51, 65, 85, 0.9); transform: scale(1.04); }
    .identity-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 16px;
      background: var(--emerald-glow);
      border: 1px solid rgba(16, 185, 129, 0.4);
      font-weight: 800;
      font-size: 14px;
      color: #FFF;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34D399;
      box-shadow: 0 0 10px #34D399;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Collection Cards */
    .collections-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .collection-folder-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .collection-folder-card:hover {
      border-color: rgba(16, 185, 129, 0.4);
    }
    .folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .folder-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .folder-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .folder-title-row h3 { font-size: 14px; font-weight: 800; }
    .folder-title-row p { font-size: 11px; color: var(--text-muted); }

    /* Request Item Rows in Collection */
    .folder-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .request-row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    .req-method {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .req-get { background: rgba(16, 185, 129, 0.2); color: #34D399; }
    .req-post { background: rgba(245, 158, 11, 0.2); color: #FBBF24; }
    .req-name {
      flex: 1;
      margin: 0 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Floating Nav */
    .floating-nav-pill {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
    }
    .nav-pill-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
    }
    .nav-pill-btn.active {
      background: var(--emerald-glow);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>
  <div class="app-screen">
    <!-- Header Capsule -->
    <div class="header-capsule">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="circle-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </div>
        <div class="identity-pill">
          <div class="pulse-dot"></div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
          <span>collections</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <div class="circle-btn" style="border-color: rgba(16, 185, 129, 0.4);" title="New Folder">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </div>
    </div>

    <!-- Collections List -->
    <div class="collections-list">
      <!-- Collection 1 -->
      <div class="collection-folder-card">
        <div class="folder-header">
          <div class="folder-title-row">
            <div class="folder-icon-box">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div>
              <h3>GitHub REST API v3</h3>
              <p>14 endpoints · 2 environments</p>
            </div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>

        <div class="folder-items">
          <div class="request-row-item">
            <span class="req-method req-get">GET</span>
            <span class="req-name">Get Authenticated User Profile</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="request-row-item">
            <span class="req-method req-post">POST</span>
            <span class="req-name">Create User Issue Repository</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
        </div>
      </div>

      <!-- Collection 2 -->
      <div class="collection-folder-card">
        <div class="folder-header">
          <div class="folder-title-row">
            <div class="folder-icon-box" style="background: rgba(6, 182, 212, 0.15); color: #22D3EE;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div>
              <h3>Stripe Payment Intents</h3>
              <p>8 endpoints · Webhooks configured</p>
            </div>
          </div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Nav Pill -->
  <div class="floating-nav-pill">
    <div class="nav-pill-btn" title="Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </div>
    <div class="nav-pill-btn" title="Intercept">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <div class="nav-pill-btn active" title="Collections">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
    </div>
    <div class="nav-pill-btn" title="Tools">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 9 6 6m0-6-6 6"/></svg>
    </div>
  </div>
</body>
</html>
