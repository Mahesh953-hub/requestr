# cbindgen config for the requestr tun2proxy bridge's plain-C-ABI surface.
#
# Only the `requestr_tun2proxy_*` functions declared directly in `src/lib.rs` are part of the
# generated header/JNI contract deliverable -- the `Java_com_example_..._*` JNI exports in
# `src/jni_bridge.rs` are consumed by the JVM directly via `System.loadLibrary` + `external fun`
# matching, never by C/C++ code, so they are intentionally excluded here (cbindgen only walks
# `src/lib.rs`'s public surface by default, so nothing extra to exclude in practice, but the
# include-list below keeps this file self-documenting if `jni_bridge.rs` ever gains its own
# `#[no_mangle] extern "C"` helpers).

language = "C"
header = "/* Generated by cbindgen for requestr-tun2proxy-bridge. Do not edit by hand. */"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen from native/tun2proxy-bridge/src/lib.rs. Do not modify manually. Regenerate with: cbindgen --config cbindgen.toml --crate requestr-tun2proxy-bridge --output include/requestr_tun2proxy.h */"
include_guard = "REQUESTR_TUN2PROXY_BRIDGE_H"
tab_width = 2
line_length = 100
cpp_compat = true

[export]
include = [
  "requestr_tun2proxy_start",
  "requestr_tun2proxy_stop",
  "requestr_tun2proxy_state",
  "requestr_tun2proxy_last_error",
  "requestr_tun2proxy_traffic_stats",
  "requestr_tun2proxy_await_stopped",
  "requestr_tun2proxy_set_event_sink",
  "requestr_tun2proxy_set_protect_callback",
]

[parse]
parse_deps = false
